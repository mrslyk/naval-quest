<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play through Naval Ravikant's How to Get Rich tweetstorm — 39 levels, podcast clips, earn NAV, cash out on Slyk."
    />
    <meta name="theme-color" content="#0c0c0b" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://navalgame.netlify.app/" />
    <meta property="og:title" content="Naval Quest" />
    <meta
      property="og:description"
      content="Play through Naval's How to Get Rich — 39 levels, earn NAV, cash out in BTC. Patrons fund the prize pool via Stripe."
    />
    <meta property="og:image" content="https://navalgame.netlify.app/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naval Quest" />
    <meta
      name="twitter:description"
      content="Play through Naval's How to Get Rich — 39 levels, earn NAV, cash out in BTC."
    />
    <meta name="twitter:image" content="https://navalgame.netlify.app/og-image.svg" />
    <title>Naval Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        background:
          radial-gradient(ellipse 80% 60% at 50% 35%, rgba(196, 165, 116, 0.12), transparent 70%),
          linear-gradient(180deg, #151412 0%, #0c0c0b 100%);
        color: #eceae3;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .boot-splash__kicker {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #c4a574;
      }
      .boot-splash__title {
        margin: 0 0 0.75rem;
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 400;
        line-height: 1.05;
      }
      .boot-splash__lede {
        margin: 0;
        max-width: 28rem;
        font-size: 1.05rem;
        line-height: 1.55;
        color: #9b9890;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <p class="boot-splash__kicker">Play to earn NAV</p>
        <h1 class="boot-splash__title">Naval Quest</h1>
        <p class="boot-splash__lede">
          39 levels through Naval's wealth framework — sponsor the prize pool, play, cash out in BTC.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
