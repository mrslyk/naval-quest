<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play through Naval Ravikant's How to Get Rich tweetstorm — 39 levels, podcast clips, earn NAV, cash out on Slyk."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://navalgame.netlify.app/" />
    <meta property="og:title" content="Naval Quest" />
    <meta
      property="og:description"
      content="Get rich without getting lucky — 39 levels from Naval’s tweetstorm. Earn NAV. Cash out in BTC."
    />
    <meta property="og:image" content="https://navalgame.netlify.app/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naval Quest" />
    <meta
      name="twitter:description"
      content="Get rich without getting lucky — 39 levels from Naval’s tweetstorm."
    />
    <meta name="twitter:image" content="https://navalgame.netlify.app/og-image.svg" />
    <title>Naval Quest</title>
    <link
      href="https://fonts.cdnfonts.com/css/clear-sans"
      rel="stylesheet"
    />
    <style>
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        background: #ffffff;
        color: #1a1a1b;
        font-family: 'Clear Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .boot-splash__kicker {
        margin: 0 0 0.75rem;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #787c7e;
        font-weight: 700;
      }
      .boot-splash__title {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 8vw, 2.75rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        line-height: 1.1;
      }
      .boot-splash__lede {
        margin: 0;
        max-width: 22rem;
        font-size: 0.95rem;
        line-height: 1.55;
        color: #565758;
      }
      .boot-splash__tiles {
        display: grid;
        grid-template-columns: repeat(5, 2.5rem);
        gap: 0.3rem;
        margin-top: 1.75rem;
      }
      .boot-splash__tiles span {
        display: grid;
        place-items: center;
        height: 2.5rem;
        border: 2px solid #d3d6da;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .boot-splash__tiles span:nth-child(1) { background: #6aaa64; border-color: #6aaa64; color: #fff; }
      .boot-splash__tiles span:nth-child(2) { background: #c9b458; border-color: #c9b458; color: #fff; }
      .boot-splash__tiles span:nth-child(3) { background: #787c7e; border-color: #787c7e; color: #fff; }
      .boot-splash__tiles span:nth-child(4) { background: #6aaa64; border-color: #6aaa64; color: #fff; }
      .boot-splash__tiles span:nth-child(5) { background: #787c7e; border-color: #787c7e; color: #fff; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <p class="boot-splash__kicker">Play to earn NAV</p>
        <h1 class="boot-splash__title">Naval Quest</h1>
        <p class="boot-splash__lede">
          39 levels through Naval’s wealth framework.
        </p>
        <div class="boot-splash__tiles" aria-hidden="true">
          <span>N</span><span>A</span><span>V</span><span>A</span><span>L</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
